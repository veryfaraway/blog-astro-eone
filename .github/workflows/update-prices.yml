name: Update Stock Prices

on:
  schedule:
    - cron: '30 22 * * 1-5'  # UTC 22:30 = KST 07:30 (다음날 아침), 장 마감(4PM ET) 후 1.5~2.5시간
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest prices
        run: node scripts/fetch-prices.mjs

      - name: Archive old price files
        run: node scripts/archive-prices.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/prices/
          git diff --staged --quiet || git commit -m "chore: update stock prices $(date +%Y-%m-%d)"
          git push
