name: Update Stock Prices

on:
  schedule:
    - cron: '0 0 * * 1-5'  # UTC 00:00 = KST 09:00, 평일
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest prices
        run: node scripts/fetch-prices.mjs
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Archive old price files
        run: node scripts/archive-prices.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/prices/
          git diff --staged --quiet || git commit -m "chore: update stock prices $(date +%Y-%m-%d)"
          git push
