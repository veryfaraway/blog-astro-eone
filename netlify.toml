[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_GA_ID = "G-49PMYESYMW"

[[headers]]
  for = "/vault/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# mustardseed.eone.one → life / money
# frugal 카테고리 포스트는 /money, 나머지는 /life
[[redirects]]
  from = "https://mustardseed.eone.one/tags/*"
  to = "https://blog.eone.one/tags/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://mustardseed.eone.one/post/frugal/*"
  to = "https://blog.eone.one/money/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://mustardseed.eone.one/post/:year/:day/shinhan-50-plus*"
  to = "https://blog.eone.one/money/shinhan-50-plus"
  status = 301
  force = true

[[redirects]]
  from = "https://mustardseed.eone.one/post/:year/:day/:slug"
  to = "https://blog.eone.one/life/:slug"
  status = 301
  force = true

[[redirects]]
  from = "https://mustardseed.eone.one/*"
  to = "https://blog.eone.one/life/:splat"
  status = 301
  force = true

# burn.eone.one → tools / dev
[[redirects]]
  from = "https://burn.eone.one/tags/*"
  to = "https://blog.eone.one/tags/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://burn.eone.one/*"
  to = "https://blog.eone.one/dev/:splat"
  status = 301
  force = true

# popcorn.eone.one → culture
[[redirects]]
  from = "https://popcorn.eone.one/tags/*"
  to = "https://blog.eone.one/tags/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://popcorn.eone.one/*"
  to = "https://blog.eone.one/culture/:splat"
  status = 301
  force = true

# blog.eone.one 내 레거시/중첩 경로 보정 (GA4 404 유입 방지)
[[redirects]]
  from = "/life/tags/*"
  to = "/tags/:splat"
  status = 301

[[redirects]]
  from = "/dev/tags/*"
  to = "/tags/:splat"
  status = 301

[[redirects]]
  from = "/culture/tags/*"
  to = "/tags/:splat"
  status = 301

[[redirects]]
  from = "/life/post/:year/:day/shinhan-50-plus*"
  to = "/money/shinhan-50-plus"
  status = 301

[[redirects]]
  from = "/life/post/:year/:day/:slug"
  to = "/life/:slug"
  status = 301

[[redirects]]
  from = "/Life/볼보-딜러사-한눈에-보기"
  to = "/life/volvo-partners"
  status = 301

[[redirects]]
  from = "/:section/ko/:year/:slug"
  to = "/:section/:slug"
  status = 301
