<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    circle, line, path { stroke: #181C14; }
    @media (prefers-color-scheme: dark) {
      circle, line, path { stroke: #ECDFCC; }
    }
  </style>
  <!-- 원형 틀 -->
  <circle cx="16" cy="16" r="13" stroke-width="1.5"/>
  <!-- e 교차선 -->
  <line x1="10" y1="16" x2="22" y2="16" stroke-width="2.5" stroke-linecap="round"/>
  <!-- e 볼 호: (22,16)에서 시계방향 320°, (20.6, 12.1) 종료 — 우측 상단에 40° gap -->
  <path d="M 22 16 A 6 6 0 1 1 20.6 12.1" stroke-width="2.5" stroke-linecap="round"/>
</svg>
